[project]
name = "pill-city"
version = "0.1.0"
description = "A social network reminiscent of Google+ with enhancements"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleach<4.0",
    "boto3>=1.42.64",
    "celery[redis]>=5.6.2",
    "colorthief==0.2.1",
    "emoji==1.4.2",
    "feedgen==0.9.0",
    "flask>=2.1.3",
    "flask-cors>=6.0.2",
    "flask-jwt-extended>=4.7.1",
    "flask-restful>=0.3.10",
    "linkpreview>=0.12.1",
    "markupsafe==2.0.1",
    "mongoengine==0.23.1",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.2",
    "redis>=6.4.0",
    "requests==2.26.0",
    "requests-toolbelt==0.9.1",
    "sentry-sdk[flask]>=2.54.0",
    "setuptools>=82.0.1",
    "urlextract==1.6.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.34.1",
    "freezegun>=1.5.5",
    "mongomock>=4.3.0",
    "pytest>=9.0.2",
]
