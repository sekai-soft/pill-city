[build]
  base = "web/"
  publish = "build"
  command = "npm run build"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  REACT_APP_API_ENDPOINT = "https://api.pill.city/api"

[[redirects]]
from = "/api"
to = "https://api.pill.city/docs"
status = 301

# This a rule for Single Page Applications
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
