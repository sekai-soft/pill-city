services:
  web:
    image: ghcr.io/sekai-soft/pill-city:latest
    container_name: pill-city
    restart: unless-stopped
    # env_file:
    #   - env
    depends_on:
      - mongodb
      - redis
  # worker:
  #   image: ghcr.io/sekai-soft/pill-city:latest
  #   restart: unless-stopped
  #   entrypoint: /home/app/entrypoint-worker.sh
  #   env_file:
  #     - env
  #   depends_on:
  #     - mongodb
  #     - redis
  # beat:
  #   image: ghcr.io/sekai-soft/pill-city:latest
  #   restart: unless-stopped
  #   entrypoint: /home/app/entrypoint-beat.sh
  #   env_file:
  #     - env
  #   depends_on:
  #     - mongodb
  #     - redis
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 10
    network_mode: service:resources-ts
    labels:
      - com.centurylinklabs.watchtower.enable=true
  redis:
    image: redis
    restart: unless-stopped
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 1s
      timeout: 3s
      retries: 30
    network_mode: service:resources-ts
    labels:
      - com.centurylinklabs.watchtower.enable=true
  resources-ts:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: pill-city-resources
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    env_file:
      - /home/nixos/ts-authkey-env
    volumes:
      - resources-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  mongodb_data:
  redis_data:
  resources-ts:
