services:
  pill-city:
    image: ghcr.io/sekai-soft/pill-city:latest
    container_name: pill-city
    restart: unless-stopped
    env_file:
      - env
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      pill-city-ts:
        condition: service_healthy
    network_mode: service:pill-city-ts
    labels:
      - com.centurylinklabs.watchtower.enable=true
  pill-city-ts:
    image: tailscale/tailscale:latest
    container_name: pill-city-ts
    restart: unless-stopped
    hostname: pill-city
    command:
      - /bin/sh
      - -c
      - |
        echo "[ts] waiting for tailscale control-plane reachability..."
        until nc -z -w 2 api.tailscale.com 443 >/dev/null 2>&1 && nc -z -w 2 controlplane.tailscale.com 443 >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ts] control-plane reachable, starting containerboot"
        exec /usr/local/bin/containerboot
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -Eq '\"BackendState\": *\"Running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    env_file:
      - $HOME/env-tailscale
    volumes:
      - pill-city-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true

  worker:
    image: ghcr.io/sekai-soft/pill-city:latest
    container_name: pill-city-worker
    restart: unless-stopped
    entrypoint: ["celery", "-A", "pillcity.tasks", "worker", "--loglevel=INFO"]
    env_file:
      - env
    depends_on:
      - mongodb
      - redis
  beat:
    image: ghcr.io/sekai-soft/pill-city:latest
    container_name: pill-city-beat
    restart: unless-stopped
    entrypoint: ["celery", "-A", "pillcity.tasks", "beat", "--loglevel=DEBUG", "--max-interval", "30"]
    env_file:
      - env
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    container_name: pill-city-mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      resources-ts:
        condition: service_healthy
    network_mode: service:resources-ts
    labels:
      - com.centurylinklabs.watchtower.enable=true
  mongodb-backup:
    image: ternandsparrow/mongodb-backup-s3:1.2.2
    restart: unless-stopped
    container_name: pill-city-mongodb-backup
    env_file:
      - ./env-backup
    environment:
      - MONGODB_HOST=pill-city-resources
      - MONGODB_PORT=27017
      - MONGODB_USER=admin
      - MONGODB_PASS=
      - RETAIN_COUNT=14
      - DISABLE_CRON=true
    depends_on:
      resources-ts:
        condition: service_healthy
    network_mode: service:resources-ts
    labels:
      - com.centurylinklabs.watchtower.enable=true
  redis:
    image: redis
    restart: unless-stopped
    container_name: pill-city-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      resources-ts:
        condition: service_healthy
    network_mode: service:resources-ts
    labels:
      - com.centurylinklabs.watchtower.enable=true
  resources-ts:
    image: tailscale/tailscale:latest
    container_name: pill-city-resources
    restart: unless-stopped
    hostname: pill-city-resources
    command:
      - /bin/sh
      - -c
      - |
        echo "[ts] waiting for tailscale control-plane reachability..."
        until nc -z -w 2 api.tailscale.com 443 >/dev/null 2>&1 && nc -z -w 2 controlplane.tailscale.com 443 >/dev/null 2>&1; do
          sleep 2
        done
        echo "[ts] control-plane reachable, starting containerboot"
        exec /usr/local/bin/containerboot
    environment:
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -Eq '\"BackendState\": *\"Running\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    env_file:
      - $HOME/env-tailscale
    volumes:
      - resources-ts:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  pill-city-ts:
  mongodb_data:
  redis_data:
  resources-ts:
